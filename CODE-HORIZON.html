<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Code Horizon · Do Campo à Mesa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --font-heading:'Fraunces', Georgia, serif;
    --font-body:'Outfit', system-ui, sans-serif;

    --color-background:#F7F5EF;
    --color-foreground:#1A291A;

    --color-card:#FFFFFF;
    --color-card-foreground:#1A291A;

    --color-primary:#2D6A4F;
    --color-primary-hover:#255a42;
    --color-primary-foreground:#FFFFFF;

    --color-secondary:#D8F3DC;
    --color-secondary-foreground:#2D6A4F;

    --color-muted:#EEEAE1;
    --color-muted-foreground:#6B7B6B;

    --color-accent:#74C69D;
    --color-accent-hover:#63b78d;
    --color-accent-foreground:#1A291A;

    --color-terra:#C07A52;
    --color-terra-foreground:#FFFFFF;

    --color-border:#D8D4C8;
    --color-ring:#74C69D;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:var(--font-body);
    background-color:var(--color-background);
    color:var(--color-foreground);
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit; text-decoration:none;}
  button{font-family:inherit; cursor:pointer; border:none; background:none;}
  img{display:block; max-width:100%;}

  .font-heading{font-family:var(--font-heading);}

  .scrollbar-hide{scrollbar-width:none; -ms-overflow-style:none;}
  .scrollbar-hide::-webkit-scrollbar{display:none;}

  .container{max-width:80rem; margin:0 auto; padding:0 1rem;}
  @media(min-width:1024px){.container{padding:0 1.5rem;}}

  /* ---------- Header ---------- */
  .site-header{
    position:fixed; top:0; left:0; right:0; z-index:50;
    background:rgba(255,255,255,0.95);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    border-bottom:1px solid var(--color-border);
    box-shadow:0 1px 2px rgba(0,0,0,0.04);
  }
  .header-row{
    display:flex; align-items:center; gap:1rem; height:4rem;
  }
  .logo{display:flex; align-items:center; gap:0.5rem; flex-shrink:0;}
  .logo-mark{
    width:2.25rem; height:2.25rem; background:var(--color-primary);
    border-radius:0.75rem; display:flex; align-items:center; justify-content:center;
    color:var(--color-primary-foreground); box-shadow:0 1px 2px rgba(0,0,0,0.06);
    transition:background 0.2s;
  }
  .logo:hover .logo-mark{background:var(--color-primary-hover);}
  .logo-text{line-height:1;}
  .logo-title{
    font-family:var(--font-heading); font-weight:700; font-size:1.25rem;
    color:var(--color-primary); letter-spacing:-0.01em;
  }
  .logo-sub{
    display:block; font-size:9px; color:var(--color-muted-foreground);
    text-transform:uppercase; letter-spacing:0.04em; margin-top:2px;
  }

  .search-wrap{flex:1; max-width:32rem; margin:0 auto;}
  .search-box{
    display:flex; align-items:center; background:var(--color-muted);
    border-radius:0.75rem; padding:0.625rem 1rem; gap:0.625rem;
    box-shadow:0 0 0 1px transparent; transition:box-shadow 0.15s;
  }
  .search-box:focus-within{box-shadow:0 0 0 2px var(--color-ring);}
  .search-box svg{color:var(--color-muted-foreground); flex-shrink:0;}
  .search-box input{
    flex:1; background:transparent; border:none; outline:none;
    font-size:0.875rem; color:var(--color-foreground); font-family:inherit;
  }
  .search-box input::placeholder{color:var(--color-muted-foreground);}

  .header-actions{display:flex; align-items:center; gap:0.5rem; flex-shrink:0;}
  .btn-signin{
    display:flex; align-items:center; gap:0.375rem; font-size:0.875rem;
    color:var(--color-muted-foreground); padding:0.5rem 0.75rem;
    border-radius:0.5rem; transition:background 0.15s, color 0.15s;
  }
  .btn-signin:hover{background:var(--color-muted); color:var(--color-foreground);}
  @media(max-width:639px){.btn-signin{display:none;}}

  .btn-cart{
    position:relative; display:flex; align-items:center; justify-content:center;
    width:2.5rem; height:2.5rem; border-radius:0.75rem;
    color:var(--color-muted-foreground); transition:background 0.15s, color 0.15s;
  }
  .btn-cart:hover{background:var(--color-muted); color:var(--color-foreground);}
  .cart-badge{
    position:absolute; top:-4px; right:-4px; min-width:18px; height:18px;
    background:var(--color-accent); color:var(--color-accent-foreground);
    font-size:10px; font-weight:700; border-radius:9999px;
    display:flex; align-items:center; justify-content:center; padding:0 4px;
  }

  .filters-nav{
    display:flex; align-items:center; gap:0.25rem; padding-bottom:0.625rem;
    overflow-x:auto;
  }
  .filter-chip{
    display:flex; align-items:center; gap:0.375rem; font-size:0.75rem;
    color:var(--color-muted-foreground); white-space:nowrap;
    padding:0.375rem 0.75rem; border-radius:9999px;
    border:1px solid transparent; transition:background 0.15s, color 0.15s, border-color 0.15s;
  }
  .filter-chip:hover{background:var(--color-muted); color:var(--color-foreground); border-color:var(--color-border);}

  /* ---------- Main / Hero ---------- */
  main{padding-top:104px;}
  .hero-section{margin-bottom:4rem;}
  .hero-card{
    position:relative; border-radius:1.5rem; overflow:hidden;
    background:var(--color-primary);
    display:grid; grid-template-columns:1fr; min-height:480px;
  }
  @media(min-width:1024px){.hero-card{grid-template-columns:1fr 1fr;}}
  .hero-content{
    position:relative; display:flex; flex-direction:column; justify-content:center;
    padding:3.5rem 2.5rem; z-index:1;
  }
  @media(min-width:1024px){.hero-content{padding:5rem 4rem;}}
  .hero-eyebrow{
    display:inline-flex; align-items:center; gap:0.375rem;
    color:var(--color-accent); font-size:0.875rem; font-weight:500; margin-bottom:1.25rem;
  }
  .hero-eyebrow .rule{width:1.25rem; height:1px; background:var(--color-accent); display:inline-block;}
  .hero-title{
    font-family:var(--font-heading); font-size:2.25rem; font-weight:700;
    color:#fff; line-height:1.15; margin:0 0 1.25rem;
  }
  @media(min-width:1024px){.hero-title{font-size:3rem;}}
  .hero-title em{font-style:normal; color:var(--color-accent);}
  .hero-desc{
    color:rgba(255,255,255,0.75); font-size:1rem; line-height:1.6;
    margin:0 0 2rem; max-width:24rem;
  }
  @media(min-width:1024px){.hero-desc{font-size:1.125rem;}}
  .btn-cta{
    display:inline-flex; align-items:center; gap:0.5rem;
    background:var(--color-accent); color:var(--color-accent-foreground);
    font-weight:600; font-size:0.9375rem; padding:0.75rem 1.5rem;
    border-radius:0.75rem; transition:background 0.15s;
  }
  .btn-cta:hover{background:var(--color-accent-hover);}

  /* ---------- Catalog ---------- */
  .catalog-section{margin-bottom:4rem;}
  .catalog-title{
    font-family:var(--font-heading); font-size:1.5rem; font-weight:700;
    margin:0 0 1.5rem;
  }
  .product-grid{
    display:grid; grid-template-columns:1fr; gap:1.5rem;
  }
  @media(min-width:640px){.product-grid{grid-template-columns:repeat(2,1fr);}}
  @media(min-width:768px){.product-grid{grid-template-columns:repeat(3,1fr);}}
  @media(min-width:1024px){.product-grid{grid-template-columns:repeat(4,1fr);}}

  .no-results{
    text-align:center; padding:3rem 1rem; color:var(--color-muted-foreground);
    font-size:0.9375rem; grid-column:1/-1;
  }

  /* ---------- Product Card ---------- */
  .product-card{
    background:var(--color-card); border-radius:1rem; overflow:hidden;
    box-shadow:0 1px 2px rgba(0,0,0,0.04); border:1px solid rgba(216,212,200,0.5);
    display:flex; flex-direction:column; height:100%;
    transition:box-shadow 0.25s, border-color 0.25s, transform 0.25s;
  }
  .product-card:hover{
    box-shadow:0 10px 25px rgba(0,0,0,0.08);
    border-color:rgba(116,198,157,0.4);
  }
  .product-media{
    position:relative; background:var(--color-muted); height:12rem;
    flex-shrink:0; overflow:hidden;
  }
  .product-media img{
    width:100%; height:100%; object-fit:cover;
    transition:transform 0.5s;
  }
  .product-card:hover .product-media img{transform:scale(1.05);}

  .badge{
    position:absolute; top:0.75rem; left:0.75rem;
    font-size:10px; font-weight:600; padding:2px 8px; border-radius:9999px;
  }
  .badge-accent{background:var(--color-accent); color:var(--color-accent-foreground);}
  .badge-primary{background:var(--color-primary); color:var(--color-primary-foreground);}
  .badge-terra{background:var(--color-terra); color:var(--color-terra-foreground);}

  .badge-bio{
    position:absolute; top:0.75rem; right:0.75rem;
    background:rgba(255,255,255,0.9); color:var(--color-primary);
    font-size:10px; font-weight:600; padding:2px 8px; border-radius:9999px;
    display:flex; align-items:center; gap:2px;
  }

  .product-body{padding:1rem; display:flex; flex-direction:column; flex:1;}
  .product-name{font-weight:600; font-size:0.875rem; line-height:1.35; margin:0;}
  .product-origin{
    color:var(--color-muted-foreground); font-size:0.75rem; margin:2px 0 0;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .product-rating{display:flex; align-items:center; gap:4px; margin-top:0.5rem;}
  .product-rating .rating-num{font-size:0.75rem; font-weight:500;}
  .product-rating .rating-count{font-size:0.75rem; color:var(--color-muted-foreground);}

  .product-tags{display:flex; flex-wrap:wrap; gap:4px; margin-top:0.5rem;}
  .tag{font-size:10px; padding:2px 8px; border-radius:9999px;}
  .tag-certified{background:var(--color-secondary); color:var(--color-secondary-foreground); font-weight:500;}
  .tag-distance{background:var(--color-muted); color:var(--color-muted-foreground);}

  .product-carbon{
    display:flex; align-items:center; gap:4px; margin-top:0.5rem;
    font-size:0.75rem; color:var(--color-muted-foreground);
  }
  .product-carbon .leaf-emoji{color:var(--color-accent); font-size:0.75rem;}

  .product-footer{
    display:flex; align-items:center; justify-content:space-between;
    margin-top:auto; padding-top:0.75rem;
  }
  .product-price{line-height:1;}
  .product-price .amount{
    font-family:var(--font-heading); font-weight:700; font-size:1.125rem;
    color:var(--color-primary);
  }
  .product-price .unit{font-size:0.75rem; color:var(--color-muted-foreground); margin-left:2px;}

  .btn-add{
    font-size:0.75rem; font-weight:600; padding:0.5rem 0.75rem;
    border-radius:0.75rem; background:var(--color-primary); color:var(--color-primary-foreground);
    transition:background 0.2s, transform 0.15s;
  }
  .btn-add:hover{background:var(--color-primary-hover);}
  .btn-add:active{transform:scale(0.95);}
  .btn-add.added{background:var(--color-accent); color:var(--color-accent-foreground);}

  footer.site-footer{
    text-align:center; padding:2rem 1rem 3rem;
    color:var(--color-muted-foreground); font-size:0.8125rem;
  }
</style>
</head>
<body>

<header class="site-header">
  <div class="container">
    <div class="header-row">
      <a href="#" class="logo">
        <div class="logo-mark">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M17 8C8 10 5.9 16.17 3.82 21.34L5.71 22l1-2.3A4.49 4.49 0 0 0 8 20C19 20 22 3 22 3c-1 2-8 2-14 6 1-3 3-5 6-6 0 0-3 0-4 1-2 1-3 3-3 4 0 0 1-1 3-1 4 0 5 3 5 6 0 0-3-3-7-3-3 0-4 2-4 2s.5-1 2-1c4 0 6 4 6 4z"/></svg>
        </div>
        <div class="logo-text">

      <div class="search-wrap">
        <div class="search-box">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>

      </div>

      <div class="header-actions">
        <button class="btn-signin">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>

      <button class="filter-chip"><span>🌱</span><span>Tipo de Cultivo</span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg></button>
      <button class="filter-chip"><span>✓</span><span>Orgânico/Certificado</span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg></button>
      <button class="filter-chip"><span>📍</span><span>Distância/Região</span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg></button>
    </nav>
  </div>
</header>

<main>
  <section class="hero-section container">
    <div class="hero-card">
      <div class="hero-content">
        <span class="hero-eyebrow"><span class="rule"></span>Vendas diretas do produtor ao consumidor</span>
        <h1 class="hero-title">Do campo<br><em>à sua mesa,</em><br>sem atravessadores</h1>
        <p class="hero-desc">Alimentos frescos com rastreamento completo, menor pegada de carbono e renda justa para o produtor.</p>
        <div><a href="#vitrine" class="btn-cta">Explorar Produtos</a></div>
      </div>
    </div>
  </section>

  <section id="vitrine" class="catalog-section container">
    <h2 class="catalog-title">Catálogo de Produtos (<span id="productCount">12</span>)</h2>
    <div id="productGrid" class="product-grid"></div>
  </section>
</main>

<footer class="site-footer">
  Code Horizon · Do Campo à Mesa
</footer>

  const ALL_PRODUCTS = [

    { id: 2, name: "Cenoura", price: 6.5, unit: "400g", origin: "Campinas, SP", farmer: "Sítio Verde Vivo", organic: true, certified: true, carbon: 0.2, rating: 4.7, reviews: 89, image: "https://phygital-files.mercafacil.com/cenourao-bucket/uploads/produto/cenoura_kg_1c9753d4-addc-45e1-978a-050b83289827.png", distance: 32, badge: "Orgânico", badgeColor: "primary" },

  const BADGE_CLASS = { terra: "badge-terra", primary: "badge-primary", accent: "badge-accent" };

  let cartCount = 0;

  const fmtCurrency = (v) => v.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });

  const leafIconSVG = '<svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M17 8C8 10 5.9 16.17 3.82 21.34L5.71 22l1-2.3A4.49 4.49 0 0 0 8 20C19 20 22 3 22 3c-1 2-8 2-14 6 1-3 3-5 6-6 0 0-3 0-4 1-2 1-3 3-3 4 0 0 1-1 3-1 4 0 5 3 5 6 0 0-3-3-7-3-3 0-4 2-4 2s.5-1 2-1c4 0 6 4 6 4z"/></svg>';

  function productCardHTML(p) {

    const bio = p.organic ? `<span class="badge-bio">${leafIconSVG}<span>Bio</span></span>` : "";

    return `
      <article class="product-card" data-id="${p.id}">
        <div class="product-media">
          <img src="${p.image}" alt="${p.name}" loading="lazy" decoding="async">
          ${badge}
          ${bio}
        </div>
        <div class="product-body">
          <h3 class="product-name">${p.name}</h3>
          <p class="product-origin">${p.farmer} · ${p.origin}</p>
          <div class="product-rating">
            ${starIconSVG}
            <span class="rating-num">${p.rating.toFixed(1)}</span>
            <span class="rating-count">(${p.reviews})</span>
          </div>
          <div class="product-tags">
            ${certifiedTag}
            <span class="tag tag-distance">📍 ${p.distance} km</span>
          </div>
          <div class="product-carbon"><span class="leaf-emoji">🌱</span><span>${p.carbon} kg CO₂ economizado</span></div>
          <div class="product-footer">
            <div class="product-price"><span class="amount">${fmtCurrency(p.price)}</span><span class="unit">/${p.unit}</span></div>
            <button class="btn-add" data-id="${p.id}" aria-label="Adicionar ${p.name}">+ Adicionar</button>
          </div>
        </div>
      </article>
    `;
  }

  function render(products) {
    const grid = document.getElementById("productGrid");
    document.getElementById("productCount").textContent = products.length;
    if (products.length === 0) {
      grid.innerHTML = `<p class="no-results">Nenhum produto encontrado.</p>`;
      return;
    }
    grid.innerHTML = products.map(productCardHTML).join("");
  }

  function updateCartBadge() {
    const badge = document.getElementById("cartBadge");
    if (cartCount > 0) {
      badge.style.display = "flex";
      badge.textContent = cartCount;
    } else {
      badge.style.display = "none";
    }
  }

  document.getElementById("productGrid").addEventListener("click", (e) => {
    const btn = e.target.closest(".btn-add");
    if (!btn) return;
    cartCount += 1;
    updateCartBadge();
    btn.textContent = "✓ Adicionado";
    btn.classList.add("added");
    clearTimeout(btn._timer);
    btn._timer = setTimeout(() => {
      btn.textContent = "+ Adicionar";
      btn.classList.remove("added");
    }, 1200);
  });

  document.getElementById("searchInput").addEventListener("input", (e) => {
    const q = e.target.value.trim().toLowerCase();
    const filtered = q
      ? ALL_PRODUCTS.filter((p) => p.name.toLowerCase().includes(q))
      : ALL_PRODUCTS;
    render(filtered);
  });

  render(ALL_PRODUCTS);
</script>

</body>
</html>
